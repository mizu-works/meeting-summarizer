# Freeプラン向け設定。data/ 配下(waitlist.csv など)は永続ディスクなしのため
# 再デプロイ・再起動時にリセットされる可能性があります(検証段階では許容)。
# アクセスコードは Stripe 側にもバックアップされ、消えても自動で復元される(README参照)。
# waitlist も残したい場合は有料プランに切り替えて disk セクションを追加してください。
services:
  - type: web
    name: meeting-summarizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Sonnet 5 は考えてから答えるため、長い入力では gunicorn 既定の30秒を超えることがある。
    # 1リクエストが数十秒APIを待つので、スレッドで同時に捌く(既定の1スレッドだと他の人が全員待たされる)。
    # CSVはプロセス内のロックで守っているので、workers は 1 のままにすること。
    startCommand: gunicorn app:app --timeout 180 --workers 1 --threads 8
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # 設定すると /stripe/webhook で支払い完了を受け取り、その時点でコードを発行する(README参照)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # 設定すると /admin(管理ページ)が使えるようになる。未設定なら /admin は存在しない
      - key: ADMIN_PASSWORD
        sync: false
